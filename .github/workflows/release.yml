name: Packages

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['debian/**', 'rpm/**', '.github/workflows/release.yml', 'meson.build']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, image: '',              name: ubuntu-22.04 }
          - { runner: ubuntu-24.04, image: '',              name: ubuntu-24.04 }
          - { runner: ubuntu-24.04, image: 'debian:bookworm', name: debian-12 }
          - { runner: ubuntu-24.04, image: 'debian:trixie',   name: debian-13 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies
        run: |
          if [ -n "${{ matrix.image }}" ]; then SUDO=; else SUDO=sudo; fi
          $SUDO apt-get update
          DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts git \
            desktop-file-utils gettext libglib2.0-dev libgtk-3-dev \
            libkeybinder-3.0-dev libxml2-utils meson python3 txt2man valac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          for f in ../peek_*.deb; do
            cp "$f" "dist/$(basename "${f%_*}")_${{ matrix.name }}_${f##*_}"
          done
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.name }}
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools git gcc meson vala gettext \
            gtk3-devel glib2-devel keybinder3-devel desktop-file-utils \
            libappstream-glib libxml2 txt2man gzip
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n "s/^Version:\s*//p" rpm/peek.spec)
          rpmdev-setuptree
          git archive --prefix="peek-ng-$version/" -o "$HOME/rpmbuild/SOURCES/peek-$version.tar.gz" HEAD
          rpmbuild -bb rpm/peek.spec
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/*/peek-[0-9]*.rpm dist/
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-fedora
          path: dist/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Peek $GITHUB_REF_NAME" --generate-notes dist/*
